<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23262C"/>
      <stop offset="1" stop-color="#0F1013"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6A3D"/>
      <stop offset="1" stop-color="#F0371E"/>
    </linearGradient>
    <!-- cut a clean gap out of the eye where the slash crosses it (two half-planes either side
         of a 76 px band along the slash; cairosvg ignores masks) -->
    <clipPath id="cut">
      <polygon points="-109,-212 688,684 1500,684 1500,-212"/>
      <polygon points="-166,-162 631,735 -1000,735 -1000,-162"/>
    </clipPath>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="252" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="6"/>
  <g clip-path="url(#cut)">
    <path d="M86 256 C 160 148, 352 148, 426 256 C 352 364, 160 364, 86 256 Z"
          fill="none" stroke="#E8EAED" stroke-width="30" stroke-linejoin="round"/>
    <circle cx="256" cy="256" r="64" fill="#E8EAED"/>
    <circle cx="256" cy="256" r="27" fill="#15171B"/>
  </g>
  <line x1="128" y1="112" x2="384" y2="400" stroke="url(#slash)" stroke-width="36" stroke-linecap="round"/>
</svg>
